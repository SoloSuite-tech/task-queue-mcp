name: Queue security and lineage
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: queue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.lock
      - run: python -m pytest -q
      - name: Build the tested service
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t queue-ci .
      - name: Record immutable build identity
        run: docker image inspect queue-ci --format '{{.Id}}'
